name: Build & Release BALLIVE Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Setup Android NDK 26.1.10909125
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: 📦 Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x extractDebugAnnotations --no-daemon --stacktrace

      - name: 🏷️ Rename APK Artifact to BALLIVE.apk
        run: |
          mkdir -p release-output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-output/BALLIVE.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BALLIVE.apk
          fi
          ls -la release-output/BALLIVE.apk

      - name: 📤 Upload APK Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: BALLIVE-apk
          path: release-output/BALLIVE.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish BALLIVE.apk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag || 'v2.3.0') }}
          name: "BALLIVE ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.3.0' }} — Pure Live Sports, Authentic Badges & Real Competitions"
          body: |
            ## ⚽🏀🏒 BALLIVE v2.3.0 — Pure Live Sports, Authentic Badges & Real Competitions

            Standalone native Android APK update featuring:
            - 🔴 **Pure Live Matches with Custom Split Poster Backgrounds**: Only truly in-play games are displayed under Live Streams with authentic custom event artwork. Finished matches (FT) and past fixtures are completely excluded from live sections.
            - 🛡️ **Fixed Team Badges Across All Sports**: Eliminated the Arsenal crest bug! Complete high-resolution badge dictionary covering all clubs across Premier League, LaLiga, Serie A, Bundesliga, NBA, and NHL. Neutral sports shield fallback ensures no team receives incorrect crests.
            - 🚫 **Fake Matches & TV Channels Purged**: 24/7 television networks are no longer listed as fake fixtures ("vs Opponent"). 24/7 channels serve strictly as rock-solid backup streaming servers inside the player.
            - ⭐ **Dynamic Real Match of the Day**: Features the highest-profile active live fixture or marquee upcoming clash with live status indicators and real team crests.
            - 📅 **Real Competition Fixtures & Reminders**: Competition Details "Matches" tab displays real scheduled fixtures directly from Football-Data.org and ESPN with dates, kickoff times, and notification reminders.
            - 🔄 **Isolated Stream Switching**: Multi-server stream player with instant tear-down and fresh playback on every stream or server switch.

            ### 📱 Download & Install
            1. Download `BALLIVE.apk` below directly to your Android device.
            2. Tap to install (`com.piustech.ballive`).

            ### 🔍 Build Information
            - **Application Name**: BALLIVE
            - **Application ID**: `com.piustech.ballive`
            - **Target Android Version**: Android 14 (API 34)
            - **Compile SDK**: Android 15 (API 35)
            - **Architecture**: Universal (arm64-v8a, armeabi-v7a, x86, x86_64)
            - **Mode**: Standalone Offline Release (Hermes bytecode embedded)
          files: release-output/BALLIVE.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
