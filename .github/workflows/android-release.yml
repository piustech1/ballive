name: Build & Release BALLIVE Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Setup Android NDK 26.1.10909125
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: 📦 Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x extractDebugAnnotations --no-daemon --stacktrace

      - name: 🏷️ Rename APK Artifact to BALLIVE.apk
        run: |
          mkdir -p release-output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-output/BALLIVE.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BALLIVE.apk
          fi
          ls -la release-output/BALLIVE.apk

      - name: 📤 Upload APK Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: BALLIVE-apk
          path: release-output/BALLIVE.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish BALLIVE.apk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag || 'v2.4.0') }}
          name: "BALLIVE ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.4.0' }} — Multi-Sport Engine, Tale of the Tape & Official Standings"
          body: |
            ## 🥊🏀🏒⚽ BALLIVE v2.4.0 — Multi-Sport Engine, Tale of the Tape & Official Standings

            Major multi-sport and live catalog expansion release:
            - 🌐 **Comprehensive Multi-Sport Live Engine**: Expanded upstream catalogs across 9 sports (NBA, NHL, UFC/MMA/Combat, NFL, Football/Soccer, Motorsport/F1, Tennis). Now dynamically catalogs over 200+ global in-play and scheduled sporting events.
            - 🥊 **Combat Sports Tale of the Tape**: Complete combat sports overhaul for UFC, MMA, WWE, and Boxing events. Features full side-by-side fighter comparison (Height, Reach, Stance, Record, Striking stats, Takedown stats, Weight division), Fighter portraits, Fight Statistics, and Round-by-round results (NO soccer pitch or football badges!).
            - 🏀 **Basketball Hardwood Court & Quarter Box Scores**: NBA matchups now feature a true hardwood court Starting 5 with court markings (Key, 3-point arc, Rim), quarter-by-quarter scoring box tables (Q1-Q4, Totals), and authentic basketball statistics (FG%, 3PT%, FT%, Rebounds, Assists, Steals, Blocks).
            - 🏒 **Hockey Ice Rink Lines & Period Box Scores**: NHL matches feature ice rink tactical formations (Red line, Blue line, Faceoff circles), period-by-period scoring tables (1st-3rd, OT, Totals), and hockey metrics (SOG, Power Play %, Faceoff %, Hits, PIM).
            - 🏆 **Multi-Sport Official Standings & Rankings**:
              - UFC: Official Pound-for-Pound Champions & Division Contenders roster.
              - NBA: Eastern & Western Conference Standings (GP, W, L, PCT, DIFF, PTS).
              - NHL: Division Standings (GP, W, L, OTL, DIFF, PTS).
              - Football: Premier League, Champions League, LaLiga, Serie A, Bundesliga, Ligue 1 tables.
            - 📺 **Universal Web Embed & HLS Streaming**: Integrated responsive iframe player for web stream mirrors alongside direct HLS (.m3u8) video streaming with instant server switching.

            ### 📱 Download & Install
            1. Download `BALLIVE.apk` below directly to your Android device.
            2. Tap to install (`com.piustech.ballive`).

            ### 🔍 Build Information
            - **Application Name**: BALLIVE
            - **Application ID**: `com.piustech.ballive`
            - **Target Android Version**: Android 14 (API 34)
            - **Compile SDK**: Android 15 (API 35)
            - **Architecture**: Universal (arm64-v8a, armeabi-v7a, x86, x86_64)
            - **Mode**: Standalone Offline Release (Hermes bytecode embedded)
          files: release-output/BALLIVE.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
