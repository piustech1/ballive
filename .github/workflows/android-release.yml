name: Build & Release BALLIVE Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v2.8.6)'
        required: false
        default: 'v2.8.6'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Setup Android NDK 26.1.10909125
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: 📦 Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x extractDebugAnnotations --no-daemon --stacktrace

      - name: 🏷️ Rename APK Artifact to BALLIVE.apk
        run: |
          mkdir -p release-output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-output/BALLIVE.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BALLIVE.apk
          fi
          ls -la release-output/BALLIVE.apk

      - name: 📤 Upload APK Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: BALLIVE-apk
          path: release-output/BALLIVE.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish BALLIVE.apk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag || 'v2.8.6') }}
          name: "BALLIVE ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.8.6' }} — SVG Curved Hero Silhouettes, Flag Info Cards, Simplified Profile & Instant Discover/Saved"
          body: |
            ## 🚀 BALLIVE v2.8.6 — Curved SVG Hero Refinement, Profile Simplification & Instant Discover/Saved

            Focused polish, navigation, and performance release:
            - 🎨 **SVG-Clipped Extended Curved Heroes & Segmented Tabs**:
              - Replaced rounded rectangles with a continuous `react-native-svg` `ClipPath` inward-curving lower hero boundary on Competition & Team Details, paired with solid `#7650F6` Overview/Matches & Overview/Fixtures segmented controls.
            - 🏳️ **Redesigned Tournament & Team Information Cards**:
              - Eliminated duplicate header fields (`Official Tournament` and repeated metadata), introduced borderless `CircularCountryFlag` badges with cached country flag lookups, compact icons, and team abbreviations.
            - 👤 **Simplified Non-Scrolling Profile & Persistent Avatar System**:
              - Removed unused Settings, About, Privacy Policy, and System Info sections/routes; introduced an interactive avatar picker registry (`PROFILE_AVATARS`) and compact single-screen layout above the bottom bar.
            - ⚡ **Instant Discover & Saved Loading Performance**:
              - Fixed 1-frame blank tab mount lag, added shared single-driver `SkeletonPulseGroup` (`DiscoverSkeleton` + tab-aware `SavedSkeleton`), persisted `PopularTeamsService` and non-live upcoming schedule caches, and windowed horizontal carousels via `FlatList`.

            ### 📱 Download & Install
            1. Download `BALLIVE.apk` below directly to your Android device.
            2. Tap to install (`com.piustech.ballive`).

            ### 🔍 Build Information
            - **Application Name**: BALLIVE
            - **Application ID**: `com.piustech.ballive`
            - **Version**: 2.8.6
            - **Version Code**: 61
            - **Target Android Version**: Android 14 (API 34)
            - **Compile SDK**: Android 15 (API 35)
            - **Architecture**: Universal (arm64-v8a, armeabi-v7a, x86, x86_64)
            - **Mode**: Standalone Offline Release (Hermes bytecode embedded)
          files: release-output/BALLIVE.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
