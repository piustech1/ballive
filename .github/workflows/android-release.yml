name: Build & Release BALLIVE Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Setup Android NDK 26.1.10909125
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: 📦 Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x extractDebugAnnotations --no-daemon --stacktrace

      - name: 🏷️ Rename APK Artifact to BALLIVE.apk
        run: |
          mkdir -p release-output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-output/BALLIVE.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BALLIVE.apk
          fi
          ls -la release-output/BALLIVE.apk

      - name: 📤 Upload APK Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: BALLIVE-apk
          path: release-output/BALLIVE.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish BALLIVE.apk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag || 'v2.2.0') }}
          name: "BALLIVE ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.2.0' }} — Multi-Sport Live Streaming & Zero Mock Data"
          body: |
            ## ⚽🏀🏒 BALLIVE v2.2.0 — Multi-Sport Real Intelligence, Bulletproof Stream Switching & Zero Mock Data

            Installable standalone native Android APK featuring:
            - 🔄 **Bulletproof Stream Switching**: Instant stream switching between matches and servers with independent WebView isolation—completely eliminating stale stream replay and frozen feeds.
            - 🏀🏒⚽ **Multi-Sport Real-Time Intelligence**: Real-time scoreboards, live periods/clocks, and official 500x500 transparent crests for **Basketball (NBA)**, **Hockey (NHL)**, and **Football (EPL, Champions League, La Liga, Serie A, Bundesliga)** directly from ESPN Open Cloud APIs and DAG Sports.
            - 📺 **Sport-Tailored Broadcast Mirrors**: Dynamic per-fixture stream manifest resolution with dedicated 24/7 sports satellite channel backups (NBA TV FHD, NBA TV USA, NHL Network, Sky Sports PL, TNT Sports, LaLiga TV).
            - 📋 **Authentic Rosters & Boxscore Stats**: Real starting lineups, bench squads, jersey numbers, positions, and player portraits for Football, Basketball, and Hockey.
            - ⚡ **Zero Mock Data & Pulsing Skeletons**: Eliminated all placeholder mock fixtures; displays sleek pulsing skeleton cards while live feeds connect.
            - 🏆 **Live Standings**: Official standings across Premier League, Champions League, La Liga, Serie A, Bundesliga, NBA, and NHL with wins, losses, differential, and points.
            - 🔓 **Native Android 14/15 Engine**: Hardware-accelerated HLS media playback with Hermes bytecode and zero cleartext network restrictions.

            ### 📱 Download & Install
            1. Download `BALLIVE.apk` below directly to your Android device.
            2. Tap to install (`com.piustech.ballive`).

            ### 🔍 Build Information
            - **Application Name**: BALLIVE
            - **Application ID**: `com.piustech.ballive`
            - **Target Android Version**: Android 14 (API 34)
            - **Compile SDK**: Android 15 (API 35)
            - **Architecture**: Universal (arm64-v8a, armeabi-v7a, x86, x86_64)
            - **Mode**: Standalone Offline Release (Hermes bytecode embedded)
          files: release-output/BALLIVE.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
