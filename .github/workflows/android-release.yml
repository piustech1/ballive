name: Build & Release BALLIVE Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Setup Android NDK 26.1.10909125
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: 📦 Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x extractDebugAnnotations --no-daemon --stacktrace

      - name: 🏷️ Rename APK Artifact to BALLIVE.apk
        run: |
          mkdir -p release-output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-output/BALLIVE.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BALLIVE.apk
          fi
          ls -la release-output/BALLIVE.apk

      - name: 📤 Upload APK Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: BALLIVE-apk
          path: release-output/BALLIVE.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish BALLIVE.apk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag || 'v2.1.0') }}
          name: "BALLIVE ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.1.0' }} — Direct Cloud Live Sports & Football Intel"
          body: |
            ## ⚽ BALLIVE v2.1.0 — Direct Cloud Live Sports Streaming & Football Intel

            Installable standalone native Android APK featuring:
            - 🌐 **Direct Cloud Architecture**: Connects directly to high-availability cloud APIs (DAG Sports, Football-Data.org v4, CDNLiveTV). No local proxy or desktop servers needed.
            - 📺 **Live HLS Stream Player**: High-definition `.m3u8` live sports broadcasts with hardware-accelerated WebView engine and anti-hotlink referer support.
            - 🔄 **Multi-Server Mirror Switcher**: Instant switching between primary streams and 24/7 sports satellite channels (Sky Sports Premier League, TNT Sports, LaLiga TV, DAZN HD, SuperSport).
            - 🛡️ **Offline Recovery Overlay**: Graceful reconnecting banner with one-tap retry when external feeds cycle.
            - 📋 **Authentic Squads & Lineups**: Real Starting XIs and bench substitutes with player portraits.
            - 📐 **Dynamic Pitch Formations**: Real tactical coordinates calculated for any formation (`4-3-3`, `4-2-3-1`, `3-4-2-1`, `5-3-2`, etc.).
            - 📊 **Opta Match Stats & Timeline**: Real possession, shots, shots on target, corners, fouls, cards, and events.
            - 🤝 **Head-to-Head History**: Historical match results and win-draw records.
            - 🔓 **Cleartext Network Enabled**: `usesCleartextTraffic="true"` configured to prevent Android OS image/stream blocks.

            ### 📱 Download & Install
            1. Download `BALLIVE.apk` below directly to your Android device.
            2. Tap to install (`com.piustech.ballive`).

            ### 🔍 Build Information
            - **Application Name**: BALLIVE
            - **Application ID**: `com.piustech.ballive`
            - **Target Android Version**: Android 14 (API 34)
            - **Compile SDK**: Android 15 (API 35)
            - **Architecture**: Universal (arm64-v8a, armeabi-v7a, x86, x86_64)
            - **Mode**: Standalone Offline Release (Hermes bytecode embedded)
          files: release-output/BALLIVE.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
