name: Build & Release BALLIVE Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v2.8.5)'
        required: false
        default: 'v2.8.5'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Setup Android NDK 26.1.10909125
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: 📦 Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x extractDebugAnnotations --no-daemon --stacktrace

      - name: 🏷️ Rename APK Artifact to BALLIVE.apk
        run: |
          mkdir -p release-output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-output/BALLIVE.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BALLIVE.apk
          fi
          ls -la release-output/BALLIVE.apk

      - name: 📤 Upload APK Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: BALLIVE-apk
          path: release-output/BALLIVE.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish BALLIVE.apk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag || 'v2.8.5') }}
          name: "BALLIVE ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.8.5' }} — Extended Hero Headers, Real Hero Photography, Solid Form Indicators & Reliable Crest Caching"
          body: |
            ## 🚀 BALLIVE v2.8.5 — Extended Hero Headers, Real Hero Photography, Solid Form Indicators & Reliable Crest Caching

            Targeted experience and reliability upgrade:
            - 🖼️ **Extended Curved Hero Headers & Sticky Navigation**:
              - Unified the top navigation bar and team/competition identity card into a single continuous full-bleed photographic hero surface extending smoothly behind the translucent status bar with rounded `28dp` bottom corners.
            - 📸 **42 Visually Verified Hero Backgrounds & Dynamic Stadium Lookup**:
              - Bundled curated stadium/arena/action photography for 24 flagship clubs and 18 premier competitions, plus cached non-blocking lookup for dynamic teams and competitions.
            - 🟢 **Solid Recent Form Indicators**:
              - Upgraded W/D/L Recent Form circles and fixture result pills to crisp solid opaque green (`#16A34A`), amber (`#D97706`), and red (`#DC2626`) fills with bold white lettering.
            - 🛡️ **Shared Persistent Crest & Emblem Cache**:
              - Unified `TeamCrest` and `CompetitionLogo` onto a prioritized, persistent `expo-file-system` cache with multi-candidate fallback chains, first-launch preloading, and fixed CDN URLs/collisions.

            ### 📱 Download & Install
            1. Download `BALLIVE.apk` below directly to your Android device.
            2. Tap to install (`com.piustech.ballive`).

            ### 🔍 Build Information
            - **Application Name**: BALLIVE
            - **Application ID**: `com.piustech.ballive`
            - **Version**: 2.8.5
            - **Version Code**: 60
            - **Target Android Version**: Android 14 (API 34)
            - **Compile SDK**: Android 15 (API 35)
            - **Architecture**: Universal (arm64-v8a, armeabi-v7a, x86, x86_64)
            - **Mode**: Standalone Offline Release (Hermes bytecode embedded)
          files: release-output/BALLIVE.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
