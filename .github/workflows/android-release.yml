name: Build & Release BALLIVE Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Setup Android NDK 26.1.10909125
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: 📦 Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x extractDebugAnnotations --no-daemon --stacktrace

      - name: 🏷️ Rename APK Artifact to BALLIVE.apk
        run: |
          mkdir -p release-output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-output/BALLIVE.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BALLIVE.apk
          fi
          ls -la release-output/BALLIVE.apk

      - name: 📤 Upload APK Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: BALLIVE-apk
          path: release-output/BALLIVE.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish BALLIVE.apk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag || 'v2.5.0') }}
          name: "BALLIVE ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.5.0' }} — Universal Sport Details, Fullscreen Landscape Player & Multi-Sport Brandings"
          body: |
            ## 🏎️🥊🏀🏒⚽ BALLIVE v2.5.0 — Universal Sport Details, Fullscreen Landscape Player & Multi-Sport Brandings

            Major upgrade release delivering universal sport-adaptive experience:
            - 🖥️ **Fixed Viewport Architecture with ZERO Vertical Scrolling**:
              - Re-engineered `MatchDetailsScreen` with stationary bounded viewport (`flex: 1`) fitting seamlessly between curved app bar and bottom nav.
              - Dedicated heroes for Combat (UFC/MMA/Boxing/WWE), Racing (Formula 1), and Ball Sports.
              - Sport-specific adaptive panels: Tale of the Tape for combat, Hardwood Court Starting 5 for basketball, Ice Rink Lines for hockey, Pitch for football, compact overview matrix, and match events.
            - 🔄 **True Immersive Landscape Fullscreen Video Player**:
              - Smooth hardware rotation into landscape mode via `expo-screen-orientation` without unmounting player or restarting playback (continuous stream).
              - Physical Android back-button and minimize button listener to return seamlessly to portrait mode.
              - Removed distracting `• LIVE` red pill overlay and redundant `FEED SOURCE` servers dock from the viewport.
            - 🏆 **Authentic Multi-Sport Competition Brandings & Routing**:
              - Eradicated Premier League lion logo fallback across all non-football categories.
              - Added authentic emblems for NBA, NHL, NFL, F1, UFC/MMA, Tennis, Cricket, and World Cup.
              - Clicking "All" navigates to all competitions; clicking categories navigates directly to their dedicated competition screen.
            - 🏁 **Sport-Adaptive Competition Hub & Standings**:
              - Formula 1: Full Driver Championship Standings & Constructors Championship Standings.
              - Combat Sports: Official Pound-for-Pound Champions & Contenders roster.
              - Tennis: ATP & WTA World Tour Leaderboard.
              - Basketball & Hockey: NBA Conference Standings and NHL Division Standings.
              - Fixed fixture filtering preventing football fixtures from leaking into NHL/NFL/F1 hubs.
            - ⚡ **Redesigned Match of the Day & Live Score Sync**:
              - Replaced cramped ticker bar with high-impact featured card featuring club crests, bold live scores/countdown, and direct "Watch Live Stream" action.
              - Dynamic real-time score syncing via scoreboard API on live stream details screen.
              - Real live matchup switcher dynamically listing current in-play events.

            ### 📱 Download & Install
            1. Download `BALLIVE.apk` below directly to your Android device.
            2. Tap to install (`com.piustech.ballive`).

            ### 🔍 Build Information
            - **Application Name**: BALLIVE
            - **Application ID**: `com.piustech.ballive`
            - **Target Android Version**: Android 14 (API 34)
            - **Compile SDK**: Android 15 (API 35)
            - **Architecture**: Universal (arm64-v8a, armeabi-v7a, x86, x86_64)
            - **Mode**: Standalone Offline Release (Hermes bytecode embedded)
          files: release-output/BALLIVE.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
